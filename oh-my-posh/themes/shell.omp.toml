"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 4
final_space = true

# ==========================================================
# BLOCK 1: LEFT PROMPT
# ==========================================================
[[blocks]]
alignment = "left"
type = "prompt"

# User Session Segment
[[blocks.segments]]
type = "session"
style = "diamond"
foreground = "#ffffff"
background = "#c386f1"
leading_diamond = ""
trailing_diamond = ""
template = " {{ if .SSHSession }} {{ end }}{{ .UserName }} "

# Directory Path Segment
[[blocks.segments]]
type = "path"
style = "powerline"
background = "#FF9248"
foreground = "#2d3436"
powerline_symbol = ""
template = "   {{ .Path }} "
[blocks.segments.properties]
folder_icon = "  "
home_icon = ""
style = "folder"

# Git Status Segment
[[blocks.segments]]
type = "git"
style = "powerline"
powerline_symbol = ""
foreground = "#193549"
background = "#ffeb3b"
background_templates = [
    "{{ if or (.Working.Changed) (.Staging.Changed) }}#FFEB3B{{ end }}",
    "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#FFCC80{{ end }}",
    "{{ if gt .Ahead 0 }}#B388FF{{ end }}",
    "{{ if gt .Behind 0 }}#B388FB{{ end }}",
]
template = "{{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}"

[options]
fetch_status = true
fetch_upstream_icon = true
source = "cli"

[options.untracked_modes]
"/Users/user/Projects/oh-my-posh/" = "no"

[options.mapped_branches]
"feat/*" = "🚀 "
"bug/*" = "🐛 "


# Execution Time Segment
[[blocks.segments]]
type = "executiontime"
style = "diamond"
background = "#83769c"
foreground = "#ffffff"
trailing_diamond = ""
template = "  {{ .FormattedMs }} "
[blocks.segments.properties]
style = "roundrock"
threshold = 0

# ==========================================================
# BLOCK 2: RIGHT PROMPT (Language Runtimes & System Resources)
# ==========================================================
[[blocks]]
alignment = "right"
type = "prompt"

# Node.js Environment
[[blocks.segments]]
type = "node"
style = "diamond"
background = "#303030"
foreground = "#3C873A"
leading_diamond = ""
trailing_diamond = " "
template = "  {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} "
[blocks.segments.properties]
fetch_package_manager = true
npm_icon = " <#cc3a3a></> "
yarn_icon = " <#348cba></>"

# Python Environment
[[blocks.segments]]
type = "python"
style = "diamond"
background = "#306998"
foreground = "#FFE873"
leading_diamond = ""
trailing_diamond = " "
template = "  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} "

# Java Environment
[[blocks.segments]]
type = "java"
style = "diamond"
background = "#0e8ac8"
foreground = "#ffffff"
leading_diamond = ""
trailing_diamond = " "
template = "  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "

# .NET Environment
[[blocks.segments]]
type = "dotnet"
style = "diamond"
background = "#0e0e0e"
foreground = "#0d6da8"
leading_diamond = ""
trailing_diamond = " "
template = "  {{ if .Unsupported }}{{ else }}{{ .Full }}{{ end }} "

# Go Lang Environment
[[blocks.segments]]
type = "go"
style = "diamond"
background = "#ffffff"
foreground = "#06aad5"
leading_diamond = ""
trailing_diamond = " "
template = "  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "

# Rust Environment
[[blocks.segments]]
type = "rust"
style = "diamond"
background = "#f3f0ec"
foreground = "#925837"
leading_diamond = ""
trailing_diamond = " "
template = "  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "

# Dart Environment
[[blocks.segments]]
type = "dart"
style = "diamond"
background = "#e1e8e9"
foreground = "#055b9c"
leading_diamond = " "
trailing_diamond = " "
template = "  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "

# Angular Environment
[[blocks.segments]]
type = "angular"
style = "diamond"
background = "#ffffff"
foreground = "#ce092f"
leading_diamond = " "
trailing_diamond = " "
template = "  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "

# Aurelia Environment
[[blocks.segments]]
type = "aurelia"
style = "diamond"
background = "#ffffff"
foreground = "#de1f84"
leading_diamond = " "
trailing_diamond = " "
template = " α {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "

# Nx Monorepo Tools
[[blocks.segments]]
type = "nx"
style = "diamond"
background = "#1e293b"
foreground = "#ffffff"
leading_diamond = " "
trailing_diamond = " "
template = " {{ if .Error }}{{ .Error }}{{ else }}Nx {{ .Full }}{{ end }} "

# Julia Environment
[[blocks.segments]]
type = "julia"
style = "diamond"
background = "#945bb3"
foreground = "#359a25"
leading_diamond = " "
trailing_diamond = " "
template = " <#ca3c34></> {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "

# Ruby Environment
[[blocks.segments]]
type = "ruby"
style = "diamond"
background = "#ffffff"
foreground = "#9c1006"
leading_diamond = ""
trailing_diamond = " "
template = "  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "

# Azure Functions
[[blocks.segments]]
type = "azfunc"
style = "diamond"
background = "#ffffff"
foreground = "#5398c2"
leading_diamond = ""
trailing_diamond = " "
template = " <#f5bf45>⚡</> {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "

# AWS Profile Info
[[blocks.segments]]
type = "aws"
style = "diamond"
background = "#565656"
foreground = "#faa029"
leading_diamond = ""
trailing_diamond = " "
template = "  {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }} "

# Kubernetes Context Info
[[blocks.segments]]
type = "kubectl"
style = "diamond"
background = "#316ce4"
foreground = "#ffffff"
leading_diamond = ""
trailing_diamond = ""
template = " ☸ {{ .Context }}{{ if .Namespace }} :: {{ .Namespace }}{{ end }} "

# Current Active Shell Name
[[blocks.segments]]
type = "shell"
style = "diamond"
background = "#b2bec3"
foreground = "#222222"
leading_diamond = ""
trailing_diamond = "<transparent,background></>"
template = " {{ .Name }} "

# System Resource: RAM Monitoring
[[blocks.segments]]
type = "sysinfo"
style = "diamond"
background = "#54a0ff"
foreground = "#ffffff"
invert_powerline = true
leading_diamond = ""
template = "  RAM: {{ round .PhysicalPercentUsed .Precision }}% "
[blocks.segments.properties]
precision = 0

# ==========================================================
# BLOCK 3: INPUT / INTERACTION LINE
# ==========================================================
[[blocks]]
alignment = "left"
newline = true
type = "prompt"

[[blocks.segments]]
type = "text"
style = "plain"
foreground = "#21c7c7"
template = "╰─"

[[blocks.segments]]
type = "status"
style = "plain"
foreground = "#e0f8ff"
foreground_templates = ["{{ if gt .Code 0 }}#ef5350{{ end }}"]
# \n creates the clean one-line gap below the prompt line context
template = "❯"
[blocks.segments.properties]
always_enabled = true
